<!DOCTYPE html>

<html lang="en">
<head>
<meta name="color-scheme" content="only light">
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin — Cozy Hotels Maldives</title>
<meta content="noindex, nofollow" name="robots"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="assets/css/style.css" rel="stylesheet"/>
<style>
  .admin-wrap{ max-width: 760px; margin: 0 auto; padding: 40px 20px 100px; }
  .admin-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 24px; }
  .admin-head h1{ font-family: var(--font-display); font-size: 26px; color: var(--green); }
  .db-badge{ font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px; }
  .db-badge.on{ background: var(--teal-10); color: var(--teal); }
  .db-badge.off{ background: var(--coral-10); color: var(--coral); }

  .login-card{ max-width: 360px; margin: 80px auto; background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 28px; text-align:center; }
  .login-card h1{ font-family: var(--font-display); font-size: 22px; color: var(--green); margin-bottom: 16px; }
  .field{ margin-bottom: 14px; text-align:left; }
  .field label{ display:block; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .field input, .field textarea{
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); font-family: var(--font-body); font-size: 14px; background: var(--cream);
  }
  .field textarea{ min-height: 70px; resize: vertical; }
  .error-msg{ color: var(--coral); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status-msg{ font-size: 13px; margin-top: 6px; min-height: 18px; }
  .status-msg.ok{ color: var(--teal); }
  .status-msg.err{ color: var(--coral); }

  .tabs{ display:flex; gap:8px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab-btn{
    padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--white); color: var(--ink); font-size: 13px; font-weight: 600;
  }
  .tab-btn.active{ background: var(--green); color: var(--white); border-color: var(--green); }

  .panel{ display:none; background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 22px; }
  .panel.active{ display:block; }
  .panel h2{ font-family: var(--font-editorial); font-size: 18px; color: var(--green); margin-bottom: 4px; }
  .panel .group-title{ font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); margin: 18px 0 10px; }
  .panel .group-title:first-of-type{ margin-top: 6px; }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media(max-width:560px){ .row2{ grid-template-columns: 1fr; } }
  .save-row{ display:flex; align-items:center; gap: 14px; margin-top: 20px; }
</style>
<link href="assets/css/guide.css" rel="stylesheet"/><link href="assets/css/admin.css" rel="stylesheet"/><link href="assets/images/cozy-icon.svg" rel="icon" type="image/svg+xml"/></head>
<body>
<div class="admin-wrap" id="login-view">
<div class="login-card">
<h1>Cozy Hotels Admin</h1>
<form id="login-form">
<div class="field">
<label for="password">Password</label>
<input autocomplete="current-password" id="password" required="" type="password"/>
</div>
<button class="btn btn-primary btn-block" type="submit">Sign In</button>
<div class="error-msg" id="login-error" role="status"></div>
</form>
</div>
</div>
<div class="admin-wrap" hidden="" id="app-view">
<div class="admin-head">
<h1>Content Admin</h1>
<div style="display:flex; align-items:center; gap:10px;">
<span class="db-badge off" id="db-badge">Checking database…</span>
<button class="btn btn-outline-dark btn-sm" id="logout-btn">Log Out</button>
</div>
</div>
<div class="tabs">
<button class="tab-btn active" data-scope="site">Our hotels page &amp; contacts</button>
<button class="tab-btn" data-scope="cozy-nest">Cozy Nest</button>
<button class="tab-btn" data-scope="cozy-roots">Cozy Roots</button>
<button class="tab-btn" data-scope="cozy-arts">Cozy Art</button>
</div>
<!-- SITE -->
<div class="panel active" data-panel="site">Loading content…</div>
<!-- COZY NEST -->
<div class="panel" data-panel="cozy-nest">Loading content…</div>
<!-- COZY ROOTS -->
<div class="panel" data-panel="cozy-roots">Loading content…</div>
<!-- COZY ART -->
<div class="panel" data-panel="cozy-arts">Loading content…</div>
</div>
<script src="assets/js/icons.js"></script>
<script src="assets/js/admin.js?v=emergency-contacts-8"></script>
</body>
</html>
